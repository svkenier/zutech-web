<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- LCP Hero Image: prioridad nativa via fetchpriority="high" + loading="eager" en el <img> del componente -->
    <link rel="preload" as="image" href="/hero-desktop.webp?v=17" media="(min-width: 900px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-mobile.webp?v=17" media="(max-width: 899px)" fetchpriority="high" />
    <!-- SEO y Meta Tags Base (serán sobreescritos por React Helmet) -->
    <title>ZUTECH | Hardware, Laptops y Servicio Técnico en Maracaibo</title>
    <meta name="description" content="Tienda especializada en computación: venta de hardware, software y servicio técnico profesional en Maracaibo." />
    <meta name="theme-color" content="#00E5FF" />

    <!-- Open Graph Base (para crawlers sociales sin ejecución de JS) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZuTech Store" />
    <meta property="og:title" content="ZUTECH | Hardware, Laptops y Servicio Técnico en Maracaibo" />
    <meta property="og:description" content="Tienda especializada en computación: venta de hardware, software y servicio técnico profesional en Maracaibo." />
    <meta property="og:url" content="https://zetech-web.pages.dev/" />
    <meta property="og:image" content="https://zetech-web.pages.dev/hero-desktop.webp" />

    <!-- Twitter Cards Base -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZUTECH | Hardware, Laptops y Servicio Técnico en Maracaibo" />
    <meta name="twitter:description" content="Tienda especializada en computación: venta de hardware, software y servicio técnico profesional en Maracaibo." />
    <meta name="twitter:image" content="https://zetech-web.pages.dev/hero-desktop.webp" />

    <!-- Favicon & PWA -->
    <link rel="icon" href="/logo.webp" type="image/webp" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/logo.webp" />

    <!-- Tipografía Inter (Google Fonts) asíncrona -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" as="style" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root">
      <style>
        body, html {
          margin: 0;
          padding: 0;
          background-color: #060D17;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          -webkit-font-smoothing: antialiased;
        }
        .z-splash-container {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #060D17;
          z-index: 9999;
        }
        .z-splash-logo {
          width: 140px;
          height: auto;
          display: block;
          filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.15));
          margin-bottom: 24px;
        }
        .z-splash-track {
          width: 140px;
          height: 2px;
          background-color: rgba(255, 255, 255, 0.08);
          border-radius: 999px;
          overflow: hidden;
          position: relative;
        }
        .z-splash-bar {
          position: absolute;
          top: 0;
          left: 0;
          bottom: 0;
          width: 45%;
          background: linear-gradient(90deg, transparent, #00E5FF, transparent);
          box-shadow: 0 0 10px #00E5FF;
          border-radius: 999px;
          animation: z-splash-pulse 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes z-splash-pulse {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(250%); }
        }
      </style>
      <div class="z-splash-container" aria-hidden="true">
        <img src="/logo.webp" alt="ZuTech Store" class="z-splash-logo" width="140" height="37" />
        <div class="z-splash-track">
          <div class="z-splash-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
